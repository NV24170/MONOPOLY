<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202724">
  <title>Common Ground — Property & chance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      color-scheme: dark;
      --ink: #202724;
      --panel: #29322e;
      --panel-light: #34403a;
      --paper: #f3efdf;
      --paper-dim: #d9d3c2;
      --muted: #9da9a0;
      --line: #46524b;
      --mint: #a8d7bb;
      --coral: #eb9078;
      --gold: #e6c475;
      --blue: #80b7cf;
      --violet: #ae9bc8;
      --shadow: 0 18px 45px #11171466;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--ink); color: var(--paper); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    header { min-height: 76px; padding: 14px clamp(16px, 3vw, 42px); display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #ffffff12; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; place-items: center; width: 42px; aspect-ratio: 1; border-radius: 13px; color: var(--ink); background: var(--mint); font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 700; }
    .brand-name { font: 700 21px Fraunces, Georgia, serif; letter-spacing: 0; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .turn-pill, .icon-button, .primary, .secondary, .danger { min-height: 38px; border: 1px solid var(--line); border-radius: 7px; color: var(--paper); background: var(--panel); }
    .turn-pill { display: flex; align-items: center; gap: 8px; padding: 0 13px; color: var(--paper-dim); font-size: 12px; }
    .turn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }
    .icon-button { width: 40px; display: grid; place-items: center; color: var(--paper-dim); }
    .icon-button:hover, .secondary:hover { background: var(--panel-light); }
    main { width: min(1500px, 100%); margin: auto; padding: 22px clamp(12px, 2vw, 28px) 28px; display: grid; grid-template-columns: minmax(570px, 1fr) minmax(300px, 370px); gap: 22px; align-items: start; }
    .board-wrap { min-width: 0; }
    .board-meta { display: flex; justify-content: space-between; align-items: end; margin: 0 2px 12px; }
    .eyebrow { color: var(--mint); font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font: 600 26px Fraunces, Georgia, serif; letter-spacing: 0; }
    .round-count { color: var(--muted); font-size: 12px; }
    .board { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); grid-template-rows: repeat(11, minmax(0, 1fr)); gap: 3px; padding: 5px; border: 1px solid #d6cfb8; border-radius: 8px; background: #d6cfb8; box-shadow: var(--shadow); aspect-ratio: 1; }
    .tile { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-width: 0; padding: 5px 3px 4px; color: #353a32; background: var(--paper); text-align: center; }
    .tile.property { padding-top: 0; }
    .tile-band { width: 100%; height: 12px; flex: 0 0 12px; margin-bottom: 4px; background: var(--group-color, #888); border-bottom: 1px solid #0002; }
    .tile-name { max-width: 100%; font-size: clamp(7px, .78vw, 10px); font-weight: 700; line-height: 1.12; overflow-wrap: anywhere; }
    .tile-price { margin-top: auto; color: #76766d; font-size: clamp(7px, .68vw, 9px); }
    .tile-icon { font-size: clamp(12px, 1.45vw, 19px); line-height: 1; }
    .tile-kind { color: #77766d; font-size: 7px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
    .tile-corner { padding: 8px 4px; }
    .tile-corner .tile-name { font-size: clamp(8px, .85vw, 11px); }

    .tile.mortgaged { opacity: .62; }
    .tile.mortgaged::before { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; color: #5d3434; background: #e8d9cfcc; font-size: 9px; font-weight: 700; letter-spacing: 1px; content: "MORTGAGED"; transform: rotate(-18deg); }
    .tile.buildings { box-shadow: inset 0 -5px var(--building-color, #37966a); }
    .token-row { position: absolute; right: 2px; bottom: 12px; left: 2px; display: flex; justify-content: center; gap: 2px; }
    .token { width: 11px; height: 11px; display: grid; place-items: center; border: 1px solid #fff; border-radius: 50%; color: #18211d; background: var(--token-color); font-size: 6px; font-weight: 700; box-shadow: 0 1px 2px #1118; }
    .tile.has-token .tile-price { visibility: hidden; }
    .board-center { grid-column: 2 / 11; grid-row: 2 / 11; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; color: #eff0e2; background: #617c69; }
    .board-center::before, .board-center::after { position: absolute; width: 130%; height: 1px; background: #ffffff1c; content: ""; transform: rotate(-35deg); }
    .board-center::after { transform: rotate(35deg); }
    .center-stamp { position: relative; z-index: 1; display: grid; place-items: center; width: 72%; max-width: 310px; aspect-ratio: 1.7; border: 1px solid #dce2ca88; color: #f1e2b9; transform: rotate(-8deg); }
    .center-stamp strong { font: 700 clamp(27px, 5vw, 56px) Fraunces, Georgia, serif; letter-spacing: 0; }
    .center-stamp span { margin-top: -10px; font-size: 9px; font-weight: 700; letter-spacing: 3px; }
    .center-note { z-index: 1; margin-top: 16px; color: #e4ecdd; font-size: 11px; text-align: center; }
    .center-dice { z-index: 1; display: flex; gap: 8px; margin-top: 12px; }
    .die { width: 34px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 7px; color: #26322a; background: var(--paper); font-size: 17px; font-weight: 700; box-shadow: 0 2px 5px #1e2a2277; }
    .side-panel { display: flex; flex-direction: column; gap: 13px; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .active-card { padding: 16px; }
    .player-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .player-name { display: flex; align-items: center; gap: 10px; font: 600 19px Fraunces, Georgia, serif; }
    .player-token { width: 13px; height: 13px; border: 2px solid #ffffff9c; border-radius: 50%; background: var(--token-color); }
    .cash { color: var(--mint); font-size: 17px; font-weight: 700; }
    .player-subline { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .progress-line { height: 3px; margin-top: 13px; overflow: hidden; border-radius: 3px; background: #ffffff12; }
    .progress-line span { display: block; height: 100%; border-radius: inherit; background: var(--token-color); transition: width .35s ease; }
    .action-panel { padding: 14px; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; color: var(--paper-dim); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .phase-label { color: var(--mint); font-size: 10px; font-weight: 600; letter-spacing: 0; }
    .landing-title { margin: 0 0 5px; font: 600 20px Fraunces, Georgia, serif; }
    .action-copy { min-height: 33px; margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .button-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .primary, .secondary, .danger { min-height: 36px; padding: 0 12px; font-size: 12px; font-weight: 700; }
    .primary { border-color: var(--mint); color: #1b2921; background: var(--mint); }
    .primary:hover { background: #bde5cc; }
    .secondary { color: var(--paper-dim); }
    .danger { border-color: #794d43; color: #f3b09a; background: #49332f; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .property-list { display: flex; flex-direction: column; }
    .property-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid #ffffff0e; }
    .property-name { min-width: 0; font-size: 12px; font-weight: 600; }
    .property-meta { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .property-actions { display: flex; gap: 5px; flex: 0 0 auto; }
    .mini-button { min-height: 27px; padding: 0 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--paper-dim); background: #ffffff06; font-size: 10px; }
    .mini-button:hover { background: var(--panel-light); }
    .player-list { display: flex; flex-direction: column; gap: 0; padding: 4px 14px; }
    .score-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; min-height: 43px; border-top: 1px solid #ffffff0e; font-size: 11px; }
    .score-row:first-child { border-top: 0; }
    .score-name { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .score-cash { font-weight: 700; }
    .score-assets { color: var(--muted); text-align: right; }
    .log-panel { overflow: hidden; }
    .log-title { padding: 12px 14px 8px; color: var(--paper-dim); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .log-list { display: flex; flex-direction: column; gap: 0; max-height: 180px; overflow: auto; padding: 0 14px 10px; }
    .log-entry { padding: 8px 0; border-top: 1px solid #ffffff0e; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .log-entry:first-child { border: 0; }
    .log-entry strong { color: var(--paper-dim); font-weight: 600; }
    .bottom-actions { display: flex; gap: 7px; padding: 0 2px; }
    .bottom-actions > button { flex: 1; }
    .modal-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 16px; background: #111713bb; backdrop-filter: blur(4px); }
    .modal { width: min(480px, 100%); max-height: min(85vh, 720px); overflow: auto; padding: 21px; border: 1px solid #5c695f; border-radius: 9px; background: var(--panel); box-shadow: 0 24px 80px #1119; animation: arrive .18s ease-out; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
    .modal h2 { margin: 0 0 5px; font: 600 23px Fraunces, Georgia, serif; }
    .modal-copy { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin: 15px 0; }
    .form-field { display: flex; flex-direction: column; gap: 5px; color: var(--paper-dim); font-size: 11px; }
    .form-field input, .form-field select { width: 100%; height: 36px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; color: var(--paper); background: var(--ink); }
    .check-field { display: flex; align-items: center; gap: 9px; color: var(--paper-dim); font-size: 12px; }
    .check-field input { accent-color: var(--mint); }
    .settings-list { display: grid; gap: 13px; padding: 3px 0 18px; }
    .auction-top { display: flex; justify-content: space-between; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: #ffffff05; font-size: 12px; }
    .auction-turn { margin-top: 13px; color: var(--mint); font-size: 12px; font-weight: 700; }
    .auction-controls { display: flex; gap: 8px; margin-top: 10px; }
    .auction-controls input { width: 90px; height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--paper); background: var(--ink); }
    .trade-offer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .trade-side { display: flex; flex-direction: column; gap: 7px; }
    .trade-side h3 { margin: 2px 0 4px; color: var(--mint); font-size: 11px; text-transform: uppercase; }
    .trade-check { display: flex; align-items: center; gap: 6px; color: var(--paper-dim); font-size: 11px; }
    .trade-check input { accent-color: var(--mint); }
    .trade-cash { width: 100%; height: 33px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--paper); background: var(--ink); }
    .toast { position: fixed; z-index: 20; right: 18px; bottom: 18px; max-width: min(360px, calc(100vw - 36px)); padding: 11px 14px; border: 1px solid #56665a; border-radius: 7px; color: var(--paper); background: #34443a; box-shadow: var(--shadow); font-size: 12px; animation: arrive .16s ease-out; }
    .hidden { display: none !important; }
    @media (min-width: 1200px) { .board { --edge: 86px; } }
    @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); max-width: 720px; } .board { --edge: clamp(48px, 10vw, 67px); } .tile-name { font-size: clamp(7px, 1.2vw, 10px); } }
    @media (max-width: 480px) { header { min-height: 65px; } .brand-name { font-size: 18px; } .brand-mark { width: 36px; } .turn-pill { padding: 0 8px; font-size: 10px; } main { padding: 15px 8px 20px; gap: 14px; } .board { --edge: 8.7vw; gap: 2px; padding: 3px; } .tile { padding-right: 1px; padding-left: 1px; } .tile-band { height: 8px; flex-basis: 8px; margin-bottom: 2px; } .tile-name { font-size: 6.5px; } .tile-kind { font-size: 5.5px; } .tile-price { font-size: 6px; } .token { width: 9px; height: 9px; font-size: 5px; } .token-row { bottom: 10px; } .tile-corner { padding: 5px 2px; } h1 { font-size: 23px; } .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>

        Object.keys(state.mortgaged).forEach((key) => { if (state.owners[key] === creditorIndex) { /* mortgage state stays with the deed */ } });
        creditor.jailCards += player.jailCards; creditor.heldJailCards.push(...player.heldJailCards); player.jailCards = 0; player.heldJailCards = [];
        log(`${player.name} went bankrupt to ${creditor.name}. Their assets transfer to the creditor.`);
      } else {
        player.cash = 0;
        Object.keys(state.owners).forEach((key) => { if (Number(state.owners[key]) === playerIndex) { const buildings = buildCount(Number(key)); if (buildings === 5) state.hotels++; else state.houses += buildings; delete state.owners[key]; delete state.mortgaged[key]; state.housesOn[key] = 0; } });
        log(`${player.name} went bankrupt to the bank. Their properties return to the market.`);
      }
      player.bankrupt = true;
      if (living().length <= 1) { state.gameOver = true; state.phase = "game-over"; log(`${living()[0]?.name || "Nobody"} wins the game.`); }
      else if (state.turn === playerIndex) { state.phase = "post-roll"; }
    }
    function buyProperty(index) {
      const space = spaces[index]; const player = active(); if (player.cash < space.price) return;
      player.cash -= space.price; state.owners[index] = state.turn; log(`${player.name} bought ${space.name} for ${money(space.price)}.`); afterLanding(!!state.pending?.isDouble); closeModal(); render(); maybeBot();
    }
    function declineProperty() {
      const isDouble = !!state.pending?.isDouble; log(`${active().name} passed on ${spaces[active().position].name}.`);
      if (state.rules.auctions) startAuction(active().position, isDouble);
      else { afterLanding(isDouble); render(); maybeBot(); }
    }
    function startAuction(index, isDouble) {
      const participants = living().map((player) => state.players.indexOf(player));
      state.auction = { index, isDouble, participants, position: 0, highBid: 0, highBidder: null, currentBidder: participants[0], passed: new Set() }; state.phase = "auction"; render(); maybeBot();
    }
    function renderAuction() {
      const auction = state.auction; const bidder = state.players[auction.currentBidder]; const high = auction.highBidder === null ? "No bids yet" : `${state.players[auction.highBidder].name} · ${money(auction.highBid)}`;
      $("#action-panel").innerHTML = `<div class="section-heading">Open auction <span class="phase-label">${auction.participants.length} bidders</span></div><div class="landing-title">${spaces[auction.index].name}</div><p class="action-copy">Highest bid wins. Any player can join; passing removes you from the bidding.</p><div class="auction-top"><span>Current high bid</span><strong>${high}</strong></div><div class="auction-turn">${bidder?.name || "Auction complete"}${bidder?.bot ? " · BOT" : "'s bid"}</div>${bidder && !bidder.bot ? `<div class="auction-controls"><input type="number" id="bid-input" min="${auction.highBid + 1}" max="${bidder.cash}" placeholder="Amount"><button class="primary" id="place-bid" ${bidder.cash <= auction.highBid ? "disabled" : ""}>Bid</button><button class="secondary" id="pass-bid">Pass</button></div>` : `<p class="action-copy">Bot is considering a bid…</p>`}`;
      const bidButton = $("#place-bid"); if (bidButton) bidButton.onclick = () => placeBid(Number($("#bid-input").value));
      const passButton = $("#pass-bid"); if (passButton) passButton.onclick = passBid;
    }
    function placeBid(amount) {
      const auction = state.auction; const playerIndex = auction.currentBidder; const player = state.players[playerIndex];
      if (!Number.isInteger(amount) || amount <= auction.highBid || amount > player.cash) { toast("Enter a whole-dollar bid above the current amount."); return; }
      auction.highBid = amount; auction.highBidder = playerIndex; log(`${player.name} bid ${money(amount)} for ${spaces[auction.index].name}.`); nextBidder();
    }
    function passBid() { const auction = state.auction; auction.passed.add(auction.currentBidder); log(`${state.players[auction.currentBidder].name} passed on the auction.`); nextBidder(); }
    function nextBidder() {
      const auction = state.auction; const eligible = auction.participants.filter((index) => !auction.passed.has(index));
      if (eligible.length <= 1 && (auction.highBidder !== null || eligible.length === 0)) { finishAuction(); return; }
      const current = auction.currentBidder; const currentPosition = auction.participants.indexOf(current);
      for (let step = 1; step <= auction.participants.length; step++) { const candidate = auction.participants[(currentPosition + step) % auction.participants.length]; if (!auction.passed.has(candidate) && candidate !== current) { auction.currentBidder = candidate; break; } }
      if (auction.highBidder !== null && eligible.length === 1) finishAuction(); else { render(); maybeBot(); }
    }
    function finishAuction() {
      const auction = state.auction;
      if (auction.highBidder !== null) { const winner = state.players[auction.highBidder]; winner.cash -= auction.highBid; state.owners[auction.index] = auction.highBidder; log(`${winner.name} won ${spaces[auction.index].name} for ${money(auction.highBid)}.`); }
      else log(`${spaces[auction.index].name} remains unowned.`);
      state.auction = null; afterLanding(auction.isDouble); render(); maybeBot();
    }
    function endTurn() {
      if (state.phase !== "post-roll") return;
      if (state.gameOver) return;
      if (state.doubles && !active().jailed && !active().bankrupt) { state.phase = "pre-roll"; state.rolled = false; render(); maybeBot(); return; }
      state.doubles = 0; state.rolled = false;
      let next = state.turn;
      do { next = (next + 1) % state.players.length; } while (state.players[next].bankrupt);
      if (next <= state.turn) state.round++;
      state.turn = next; state.phase = "pre-roll"; state.pending = null; render(); maybeBot();
    }
    function sendToJail(playerIndex) { const player = state.players[playerIndex]; player.position = 10; player.jailed = true; player.jailTurns = 0; state.doubles = 0; log(`${player.name} is in Jail.`); }
    function jailRoll() {
      if (!active().jailed) return;
      const player = active(); const dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)]; state.lastDice = dice;
      if (dice[0] === dice[1]) { player.jailed = false; player.jailTurns = 0; log(`${player.name} rolled doubles and is released from Jail.`); moveBy(dice[0] + dice[1], false); }
      else { player.jailTurns++; log(`${player.name} failed to roll doubles (${player.jailTurns}/3).`); if (player.jailTurns >= 3) { player.jailed = false; player.jailTurns = 0; payBank(state.turn, 50, "Jail fine"); if (!player.bankrupt) moveBy(dice[0] + dice[1], false); else state.phase = "post-roll"; } else state.phase = "post-roll"; }
      render(); maybeBot();
    }
    function releaseFromJail(payFine) {
      const player = active(); if (!player.jailed) return;
      if (payFine) { if (player.cash < 50) { raiseFunds(state.turn, 50); if (player.cash < 50) return bankrupt(state.turn, null); } player.cash -= 50; log(`${player.name} paid $50 to leave Jail.`); }
      else { player.jailCards--; const held = player.heldJailCards.pop(); if (held) state.discard[held.deck].push(held.card); log(`${player.name} used a Get Out of Jail Free card.`); }
      player.jailed = false; player.jailTurns = 0; state.phase = "pre-roll"; jailRollAsNormal();
    }
    function jailRollAsNormal() { const dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)]; state.lastDice = dice; state.doubles = 0; moveBy(dice[0] + dice[1], false); render(); maybeBot(); }
    function sendCardToJail() { sendToJail(state.turn); state.phase = "post-roll"; }
    function drawCard(deck, isDouble) {
      if (!state.decks[deck].length) { state.decks[deck] = shuffle(state.discard[deck]); state.discard[deck] = []; }
      const card = state.decks[deck].pop(); log(`<strong>${deck === "chance" ? "Chance" : "Community Chest"}:</strong> ${card.text}`);
      if (card.kind === "move") { moveTo(card.to, card.collect); if (state.phase === "decision") state.pending.isDouble = isDouble; else if (state.phase !== "post-roll") afterLanding(isDouble); }
      else if (card.kind === "back") { const next = (active().position - card.count + 40) % 40; active().position = next; resolveSpace(next, isDouble); }
      else if (card.kind === "nearest") { const current = active().position; const indexes = spaces.map((space, index) => space.type === card.target && index > current ? index : -1).filter((index) => index >= 0); const target = indexes[0] ?? spaces.findIndex((space) => space.type === card.target); if (target <= current) collect(active(), 200, "passed GO"); active().position = target; const owner = state.owners[target]; if (owner !== undefined && owner !== state.turn) { const diceTotal = state.lastDice.reduce((a, b) => a + b, 0); const due = card.target === "utility" ? diceTotal * card.multiplier : rentFor(target, diceTotal, card.twice ? 2 : 1); if (due) payPlayer(state.turn, owner, due, `card rent for ${spaces[target].name}`); } else if (owner === undefined) { state.phase = "decision"; state.pending = { isDouble, cardMultiplier: card.multiplier }; render(); return; } afterLanding(isDouble); }
      else if (card.kind === "money") { if (card.amount > 0) collect(active(), card.amount, "card"); else payBank(state.turn, -card.amount, "card"); afterLanding(isDouble); }
      else if (card.kind === "each") { state.players.forEach((other, index) => { if (index !== state.turn && !other.bankrupt) { if (card.amount > 0) payPlayer(index, state.turn, card.amount, "card"); else payPlayer(state.turn, index, -card.amount, "card"); } }); afterLanding(isDouble); }
      else if (card.kind === "repair") { const count = Object.keys(state.housesOn).reduce((sum, index) => Number(state.owners[index]) === state.turn ? sum + (buildCount(Number(index)) === 5 ? 0 : buildCount(Number(index))) : sum, 0); const hotels = Object.keys(state.housesOn).filter((index) => Number(state.owners[index]) === state.turn && buildCount(Number(index)) === 5).length; payBank(state.turn, count * card.house + hotels * card.hotel, "property repairs"); afterLanding(isDouble); }
      else if (card.kind === "jailCard") { active().jailCards++; active().heldJailCards.push({ deck, card }); afterLanding(isDouble); }
      else if (card.kind === "jail") { state.discard[deck].push(card); sendCardToJail(); }
      if (card.kind !== "jailCard" && card.kind !== "jail") state.discard[deck].push(card);
    }
    function showTaxChoice() {
      const player = active(); openModal(`<h2>Income tax</h2><p class="modal-copy">Choose how to settle your tax bill.</p><div class="button-row"><button class="primary" id="tax-flat">Pay $200</button><button class="secondary" id="tax-worth">Pay 10% of net worth · ${money(Math.ceil(netWorth(state.turn) * .1))}</button></div>`);
      $("#tax-flat").onclick = () => settleTax(200); $("#tax-worth").onclick = () => settleTax(Math.ceil(netWorth(state.turn) * .1));
    }
    function settleTax(amount) { closeModal(); payBank(state.turn, amount, "Income Tax"); afterLanding(state.pending?.isDouble); render(); maybeBot(); }
    function build(index) {
      const space = spaces[index]; const members = groupProperties(space.group); const current = buildCount(index); const cost = groups[space.group].build;
      if (!hasMonopoly(state.turn, space.group) || active().cash < cost || current >= 5) return;
      if (members.some((member) => state.mortgaged[member])) return;
      const levels = members.map(buildCount); const minimum = Math.min(...levels); const maximum = Math.max(...levels);
      if (current !== minimum || maximum - minimum > 1 || (current === 4 ? state.hotels < 1 : state.houses < 1)) return;
      active().cash -= cost;
      if (current === 4) { state.hotels--; state.houses += 4; state.housesOn[index] = 5; }
      else { state.houses--; state.housesOn[index] = current + 1; }
      log(`${active().name} built on ${space.name} for ${money(cost)}.`); render();
    }
    function sellBuilding(index, quiet = false, playerIndex = state.turn) {
      const space = spaces[index]; const current = buildCount(index); if (!current) return;
      const members = groupProperties(space.group); const groupMax = Math.max(...members.map(buildCount));
      if (current < groupMax) return;
      if (current === 5) { state.housesOn[index] = 4; state.hotels++; state.houses -= 4; }
      else { state.housesOn[index] = current - 1; state.houses++; }
      const proceeds = Math.floor(groups[space.group].build / 2); state.players[playerIndex].cash += proceeds;
      if (!quiet) log(`${state.players[playerIndex].name} sold a building on ${space.name} for ${money(proceeds)}.`);
      if (!quiet) render();
    }
    function mortgage(index) { const space = spaces[index]; if (buildCount(index) || state.mortgaged[index]) return; const groupClear = !space.group || groupProperties(space.group).every((member) => buildCount(member) === 0); if (!groupClear) return; state.mortgaged[index] = true; active().cash += Math.floor(space.price / 2); log(`${active().name} mortgaged ${space.name} for ${money(Math.floor(space.price / 2))}.`); render(); }
    function unmortgage(index) { const space = spaces[index]; const cost = Math.ceil(space.price / 2 * 1.1); if (!state.mortgaged[index] || active().cash < cost) return; active().cash -= cost; delete state.mortgaged[index]; log(`${active().name} unmortgaged ${space.name} for ${money(cost)}.`); render(); }
    function showTrade() {
      if (!state.players.length || state.gameOver || state.phase === "auction") return;
      const from = state.turn; const targets = living().map((player, index) => ({ player, index })).filter(({ index }) => index !== from);
      if (!targets.length) return;
      const available = (playerIndex) => Object.keys(state.owners).filter((key) => {
        const index = Number(key); const group = spaces[index].group;
        return Number(state.owners[key]) === playerIndex && !buildCount(index) && (!group || groupProperties(group).every((member) => !buildCount(member)));
      }).map((key) => Number(key));
      openModal(`<h2>Propose a trade</h2><p class="modal-copy">Choose deeds, cash, and a jail-free card for each side. Only the other player can accept.</p><label class="form-field">Trade with<select id="trade-target">${targets.map(({ player, index }) => `<option value="${index}">${player.name}</option>`).join("")}</select></label><div class="trade-offer" style="margin:15px 0"><div class="trade-side"><h3>${state.players[from].name} offers</h3><input class="trade-cash" id="trade-cash-out" type="number" min="0" max="${state.players[from].cash}" placeholder="Cash"><div id="trade-out-properties"></div><div id="trade-out-card"></div></div><div class="trade-side"><h3>In return</h3><input class="trade-cash" id="trade-cash-in" type="number" min="0" placeholder="Cash"><div id="trade-in-properties"></div><div id="trade-in-card"></div></div></div><div class="button-row"><button class="primary" id="trade-propose">Propose</button><button class="secondary" id="trade-cancel">Cancel</button></div>`);
      const redrawTradeOptions = () => { const target = Number($("#trade-target").value); $("#trade-out-properties").innerHTML = available(from).map((index) => `<label class="trade-check"><input type="checkbox" value="${index}">${spaces[index].name}</label>`).join("") || `<small style="color:var(--muted)">No available deeds</small>`; $("#trade-in-properties").innerHTML = available(target).map((index) => `<label class="trade-check"><input type="checkbox" value="${index}">${spaces[index].name}</label>`).join("") || `<small style="color:var(--muted)">No available deeds</small>`; $("#trade-out-card").innerHTML = state.players[from].jailCards ? `<label class="trade-check"><input id="trade-card-out" type="checkbox">Get Out of Jail Free</label>` : ""; $("#trade-in-card").innerHTML = state.players[target].jailCards ? `<label class="trade-check"><input id="trade-card-in" type="checkbox">Get Out of Jail Free</label>` : ""; };
      redrawTradeOptions(); $("#trade-target").onchange = redrawTradeOptions; $("#trade-cancel").onclick = closeModal;
      $("#trade-propose").onclick = () => {
        const target = Number($("#trade-target").value); const cashOut = Number($("#trade-cash-out").value || 0); const cashIn = Number($("#trade-cash-in").value || 0);
        if (!Number.isSafeInteger(cashOut) || !Number.isSafeInteger(cashIn) || cashOut < 0 || cashIn < 0 || cashOut > state.players[from].cash || cashIn > state.players[target].cash) return toast("Cash amounts must be whole dollars available to each player.");
        const out = [...document.querySelectorAll("#trade-out-properties input:checked")].map((input) => Number(input.value)); const incoming = [...document.querySelectorAll("#trade-in-properties input:checked")].map((input) => Number(input.value));
        const cardOut = !!$("#trade-card-out")?.checked; const cardIn = !!$("#trade-card-in")?.checked;
        closeModal(); offerTrade({ from, target, cashOut, cashIn, out, incoming, cardOut, cardIn });
      };
    }
    function offerTrade(offer) {
      const target = state.players[offer.target];
      const summary = `${state.players[offer.from].name} offers ${money(offer.cashOut)} and ${[...offer.out.map((index) => spaces[index].name), ...(offer.cardOut ? ["a jail-free card"] : [])].join(", ") || "no deeds"} for ${money(offer.cashIn)} and ${[...offer.incoming.map((index) => spaces[index].name), ...(offer.cardIn ? ["a jail-free card"] : [])].join(", ") || "no deeds"}.`;
      if (target.bot) { const valueIn = offer.out.reduce((sum, index) => sum + spaces[index].price, 0) + offer.cashOut; const valueOut = offer.incoming.reduce((sum, index) => sum + spaces[index].price, 0) + offer.cashIn; if (valueIn >= valueOut * .85) { acceptTrade(offer); toast(`${target.name} accepted your offer.`); } else toast(`${target.name} declined the trade.`); return; }
      openModal(`<h2>Trade offer</h2><p class="modal-copy">${summary}</p><div class="button-row"><button class="primary" id="trade-accept">Accept</button><button class="secondary" id="trade-reject">Decline</button></div>`);
      $("#trade-accept").onclick = () => { acceptTrade(offer); closeModal(); toast("Trade accepted."); }; $("#trade-reject").onclick = () => { closeModal(); toast("Trade declined."); };
    }
    function acceptTrade(offer) {
      const from = state.players[offer.from]; const target = state.players[offer.target];
      if (from.cash < offer.cashOut || target.cash < offer.cashIn || (offer.cardOut && !from.jailCards) || (offer.cardIn && !target.jailCards) || offer.out.some((index) => !owns(offer.from, index)) || offer.incoming.some((index) => !owns(offer.target, index))) return toast("The offer is no longer available.");
      from.cash = from.cash - offer.cashOut + offer.cashIn; target.cash = target.cash - offer.cashIn + offer.cashOut;
      offer.out.forEach((index) => state.owners[index] = offer.target); offer.incoming.forEach((index) => state.owners[index] = offer.from);
      if (offer.cardOut) transferJailCard(from, target);
      if (offer.cardIn) transferJailCard(target, from);
      log(`${from.name} and ${target.name} completed a trade.`); render();
    }
    function transferJailCard(from, to) { const held = from.heldJailCards.pop(); if (!held) return; from.jailCards--; to.jailCards++; to.heldJailCards.push(held); }
    function maybeBot() {
      const player = active(); if (!player?.bot || state.gameOver) return;
      const phase = state.phase; const delay = 500;
      setTimeout(() => {
        if (active() !== player || state.phase !== phase || state.gameOver) return;
        if (phase === "pre-roll") { if (player.jailed) { if (player.jailCards) releaseFromJail(false); else if (player.cash > 600 || player.jailTurns >= 2) releaseFromJail(true); else jailRoll(); } else roll(); }
        else if (phase === "decision") { const space = spaces[player.position]; if (player.cash > space.price + 180 || (space.price <= 120 && player.cash > space.price + 80)) buyProperty(player.position); else declineProperty(); }
        else if (phase === "post-roll") { botManage(); endTurn(); }
        else if (phase === "auction") {
          const auction = state.auction; const property = spaces[auction.index]; const value = property.price || 100; const strategic = property.group && groupProperties(property.group).some((index) => owns(state.turn, index)); const max = Math.min(player.cash - 100, Math.round(value * (strategic ? 1.1 : .65)));
          if (max > auction.highBid && Math.random() < (strategic ? .75 : .45)) placeBid(Math.max(auction.highBid + 1, Math.min(max, auction.highBid + Math.max(10, Math.round(value * .15))))); else passBid();
        }
      }, delay);
    }
    function botManage() {
      const player = active();
      Object.keys(state.owners).map(Number).filter((index) => owns(state.turn, index)).forEach((index) => {
        const space = spaces[index];
        if (space.type !== "property" || !hasMonopoly(state.turn, space.group)) return;
        const group = groupProperties(space.group); const min = Math.min(...group.map(buildCount)); const target = group.find((member) => buildCount(member) === min); const cost = groups[space.group].build;
        const stockAvailable = buildCount(target) === 4 ? state.hotels > 0 : state.houses > 0;
        if (player.cash > cost + 250 && stockAvailable && buildCount(target) < 5) build(target);
      });
    }
    $("#settings-button").onclick = showSettings; $("#new-game-button").onclick = showSetup; $("#trade-button").onclick = showTrade;
    buildBoard(); render(); showSetup();
  </script>
